[project]
name = "i3nator"
version = "0.1.0"
description = "Declarative i3 workspace layout manager — tmuxinator for i3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Mardin Nasouti", email = "info@mardin.cc" }]
keywords = ["i3", "i3wm", "workspace", "layout", "tmuxinator", "tiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
]
dependencies = [
    "i3ipc>=2.2.1",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
i3nator = "i3nator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i3nator"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
